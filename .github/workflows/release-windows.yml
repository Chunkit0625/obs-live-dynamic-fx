name: Package OBS Windows Plugin

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Ninja & MSBuild
        uses: choco-gh/setup-chocolatey@v3

      - name: Install OBS Studio SDK via Chocolatey
        run: |
          choco install obs-studio -y

      - name: Configure CMake
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_PREFIX_PATH="C:/Program Files/obs-studio"

      - name: Build Plugin
        run: |
          cmake --build build --config Release

      - name: Stage Plugin Files
        run: |
          cmake --install build --config Release --prefix staging

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: obs-live-dynamic-fx-windows
          path: staging/
