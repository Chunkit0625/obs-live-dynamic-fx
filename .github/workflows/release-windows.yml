name: Package OBS Windows Plugin

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download OBS Studio Prebuilt SDK
        shell: powershell
        run: |
          $url = "https://github.com/obsproject/obs-studio/releases/download/30.0.0/OBS-Studio-30.0.0-Full-x64.zip"
          curl.exe -L -o obs-sdk.zip https://github.com/obsproject/obs-studio/releases/download/30.0.0/OBS-Studio-30.0.0-Full-x64.zip
          Expand-Archive -Path "obs-sdk.zip" -DestinationPath "$env:USERPROFILE\obs-sdk"

      - name: Configure CMake
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_PREFIX_PATH="$env:USERPROFILE\obs-sdk"

      - name: Build Plugin
        run: |
          cmake --build build --config Release

      - name: Stage Plugin Files
        run: |
          cmake --install build --config Release --prefix staging

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: obs-live-dynamic-fx-windows
          path: staging/
