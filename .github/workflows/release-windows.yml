name: Package OBS Windows Plugin

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup OBS Studio Development Environment
        uses: obsproject/obs-plugintemplate-action@v1
        with:
          obs-version: 30.0.0

      - name: Configure CMake
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_PREFIX_PATH="${{ env.OBS_STUDIO_DIR }}"

      - name: Build Plugin
        run: |
          cmake --build build --config Release

      - name: Stage Plugin Files
        run: |
          cmake --install build --config Release --prefix staging

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: obs-live-dynamic-fx-windows
          path: staging/
